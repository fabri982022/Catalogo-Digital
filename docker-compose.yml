services:
  mysql:
    image: mysql:8.4
    container_name: catalogo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  nextcloud-db:
    image: mariadb:11.4
    container_name: catalogo-nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MARIADB_DATABASE: ${NEXTCLOUD_DB_NAME}
      MARIADB_USER: ${NEXTCLOUD_DB_USER}
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  nextcloud:
    image: nextcloud:31-apache
    container_name: catalogo-nextcloud
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT}:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME}
      MYSQL_USER: ${NEXTCLOUD_DB_USER}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
    volumes:
      - nextcloud_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@file_get_contents(\"http://127.0.0.1/status.php\"); $$j=$$s ? json_decode($$s) : null; exit(($$j && $$j->installed === true) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      nextcloud-db:
        condition: service_healthy

  backup:
    build: ./backup
    container_name: catalogo-backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      NEXTCLOUD_WEBDAV_URL: ${NEXTCLOUD_WEBDAV_URL}
      NEXTCLOUD_BACKUP_USER: ${NEXTCLOUD_BACKUP_USER}
      NEXTCLOUD_BACKUP_APP_PASSWORD: ${NEXTCLOUD_BACKUP_APP_PASSWORD}
      NEXTCLOUD_BACKUP_PATH: ${NEXTCLOUD_BACKUP_PATH}
    depends_on:
      mysql:
        condition: service_healthy
      nextcloud:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: catalogo-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: catalogo-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "${BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/catalogos || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TEAM_MEMBERS: ${VITE_TEAM_MEMBERS}
    container_name: catalogo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    name: proyecto-catalogo-digital_mysql_data
  nextcloud_db_data:
    name: proyecto-catalogo-digital_nextcloud_db_data
  nextcloud_data:
    name: proyecto-catalogo-digital_nextcloud_data
